name: Get Citation Data

# Hundreds of AcadHomepage clones fire at 08:00 UTC, so GitHub's IP ranges
# get challenged together. Staggered off-peak runs plus a random delay give
# this job a different runner/IP than that stampede. page_build is omitted
# on purpose: it stacked overlapping crawls that Google then blocked.
on:
  schedule:
    - cron: '37 2,8,14,20 * * *'
  workflow_dispatch:

concurrency:
  group: google-scholar-crawler
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'google_scholar_crawler/requirements.txt'

      - name: Stagger start
        run: |
          delay=$((15 + RANDOM % 180))
          echo "Waiting ${delay}s to avoid synchronized Scholar crawls"
          sleep "$delay"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r google_scholar_crawler/requirements.txt

      - name: Run Crawler
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: |
          python google_scholar_crawler/main.py

      - name: Push to google-scholar-stats branch
        run: |
          if [ ! -f results/gs_data.json ] || [ ! -f results/gs_data_shieldsio.json ]; then
            echo "No fresh Scholar payload generated; skipping push."
            exit 0
          fi
          cd results
          git init
          git config --local user.name "${GITHUB_ACTOR}"
          git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git add *.json
          if git diff --cached --quiet; then
            echo "No JSON changes to publish; skipping push."
            exit 0
          fi
          git commit -m "Updated Citation Data"
          git push "${remote_repo}" HEAD:google-scholar-stats --force

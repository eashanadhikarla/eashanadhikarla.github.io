name: Get Citation Data

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r google_scholar_crawler/requirements.txt

      - name: Fetch Scholar stats
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
          SCHOLAR_DEADLINE_SECONDS: '600'
        run: python google_scholar_crawler/main.py

      # Served straight to the browser, so the site picks up new numbers
      # without waiting for a rebuild.
      - name: Publish stats to google-scholar-stats branch
        run: |
          cd results
          git init -q
          git checkout -q -b google-scholar-stats
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json
          git commit -q -m "Updated Citation Data"
          git push --force -q \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:google-scholar-stats

      # Server-rendered fallback, so the page is still correct if the browser
      # fetch above is blocked or fails.
      - name: Commit updated stats
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/scholar_stats.yml
          if git diff --cached --quiet; then
            echo "No scholar stats changes to commit."
            exit 0
          fi
          git commit -m "chore: update scholar stats data"
          git push origin master

name: Get Citation Data

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r google_scholar_crawler/requirements.txt

      - name: Fetch Scholar stats
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
          SCHOLAR_DEADLINE_SECONDS: '600'
        run: python google_scholar_crawler/main.py

      - name: Commit updated stats
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/scholar_stats.yml
          if git diff --cached --quiet; then
            echo "No scholar stats changes to commit."
            exit 0
          fi
          git commit -m "chore: update scholar stats data"
          git push origin master
